<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANU CECÍLIA - Lash Designer</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f7f1fb;
color:#5a3d6b;
}

header{
background:linear-gradient(135deg,#c98cff,#ffffff);
padding:40px 20px;
text-align:center;
}

header h1{
font-size:32px;
margin-bottom:10px;
}

header p{
font-size:18px;
}

.container{
max-width:900px;
margin:auto;
padding:25px;
}

.card{
background:#fff;
padding:25px;
margin-bottom:30px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.btn{
display:block;
width:100%;
padding:15px;
margin-top:15px;
text-align:center;
background:#b86cff;
color:white;
text-decoration:none;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.btn:hover{
background:#9d46ef;
}

input,textarea,select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:18px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

label{
font-weight:bold;
}

.servicos label{
display:block;
font-weight:normal;
margin-bottom:8px;
}

.frase{
text-align:center;
font-size:22px;
margin-top:25px;
font-style:italic;
color:#8749c9;
}
</style>

</head>
<body>

<header>

<h1>MANU CECÍLIA</h1>

<p>LASH DESIGNER</p>

</header>

<div class="container">

<div class="card">

<h2>Bem-vinda 💜</h2>

<a class="btn" href="#agenda">📅 Agendar Horário</a>

<a class="btn" target="_blank" href="https://wa.me/5511951136640">
WhatsApp
</a>

<a class="btn" target="_blank" href="https://instagram.com/logodacriativa">
Instagram
</a>

<a class="btn" target="_blank" href="https://maps.google.com/?q=Cristo+Redentor+Rio+de+Janeiro">
📍 Localização
</a>

<div class="frase">

"Cuide de você, você em primeiro lugar!"

</div>

</div>

<div class="card" id="agenda">

<h2>Agendamento</h2>

<label>Nome da Cliente</label>
<input id="nome">

<label>WhatsApp</label>
<input id="telefone">

<label>Data</label>
<input type="date" id="data">

<label>Horário</label>

<select id="horario">

<option>09:00</option>
<option>09:30</option>
<option>10:00</option>
<option>10:30</option>
<option>11:00</option>
<option>11:30</option>
<option>12:00</option>
<option>12:30</option>
<option>13:00</option>
<option>13:30</option>
<option>14:00</option>
<option>14:30</option>
<option>15:00</option>
<option>15:30</option>
<option>16:00</option>
<option>16:30</option>
<option>17:00</option>
<option>17:30</option>
<option>18:00</option>
<option>18:30</option>
<option>19:00</option>
<option>19:30</option>

</select>

<label>Serviços (pode selecionar mais de um)</label>

<div class="servicos">

<label><input type="checkbox" value="Volume Fox - R$110"> Volume Fox — R$110</label>

<label><input type="checkbox" value="Volume Russo - R$100"> Volume Russo — R$100</label>

<label><input type="checkbox" value="Volume Brasileiro - R$200"> Volume Brasileiro — R$200</label>

<label><input type="checkbox" value="Volume 3D - R$59"> Volume 3D — R$59</label>

<label><input type="checkbox" value="Manutenção Fox - R$90"> Manutenção Fox — R$90</label>

<label><input type="checkbox" value="Manutenção Russo - R$80"> Manutenção Russo — R$80</label>

<label><input type="checkbox" value="Manutenção Brasileiro - R$100"> Manutenção Brasileiro — R$100</label>

<label><input type="checkbox" value="Manutenção 3D - R$30"> Manutenção 3D — R$30</label>

</div>

<label>Observações</label>

<textarea id="obs" rows="4"></textarea>

<button class="btn" onclick="enviar()">

Confirmar Agendamento

</button>

</div>

</div>

<script>

const data=document.getElementById("data");

data.addEventListener("change",function(){

let dia=new Date(this.value+"T00:00");

if(dia.getDay()==0){

alert("Domingo não há atendimento. Escolha outra data.");

this.value="";

}

});

function enviar(){

let nome=document.getElementById("nome").value;

let telefone=document.getElementById("telefone").value;

let data=document.getElementById("data").value;

let horario=document.getElementById("horario").value;

let obs=document.getElementById("obs").value;

let lista=[];

document.querySelectorAll("input[type=checkbox]:checked").forEach(item=>{

lista.push(item.value);

});

if(nome==""||telefone==""||data==""){

alert("Preencha todos os campos.");

return;

}

let mensagem=

`🌸 *NOVO AGENDAMENTO* 🌸

👩 Cliente: ${nome}

📱 WhatsApp: ${telefone}

📅 Data: ${data}

🕒 Horário: ${horario}

💖 Serviços:
${lista.join("\n")}

📝 Observações:
${obs}

Aguardo confirmação do meu agendamento. 💜`;

window.open("https://wa.me/5511951136640?text="+encodeURIComponent(mensagem));

}

</script>

</body>
</html>
